[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duality-sizing"
version = "0.1.0"
description = "Duality engine cycle and aircraft constraint-sizing workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aerosandbox",
    "matplotlib",
    "numpy",
    "om-pycycle",
    "openmdao",
]

[tool.setuptools.packages.find]
include = [
    "coupled_mission*",
    "data*",
    "example_cycles*",
    "sizing*",
]

[tool.setuptools.package-data]
"data.aero" = [
    "cla_theory_ratio/*.csv",
    "leading_edge_suction/*.csv",
]
