[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duality-sizing"
version = "0.1.0"
description = "Duality engine cycle and aircraft constraint-sizing workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aerosandbox",
    "matplotlib",
    "numpy",
    "om-pycycle",
    "openmdao",
]

[tool.setuptools.packages.find]
include = [
    "aero*",
    "coupled_mission*",
    "example_cycles*",
    "mission*",
    "propulsion*",
    "sizing*",
    "tank*",
    "weight*",
]

[tool.setuptools.package-data]
"aero.data" = [
    "cla_theory_ratio/*.csv",
    "cla_theory_ratio/*.tar",
    "leading_edge_suction/*.csv",
    "leading_edge_suction/*.tar",
]
"propulsion.data" = [
    "*.csv",
    "*.json",
    "*.png",
    "turbine/*.csv",
]
